name: CI
on: [push, pull_request]
env:
  BUILD_DIR: _build
  PIP_PACKAGES: >-
    meson ninja gcovr numpy pytest
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build: [meson]
        build-type: [debug]
        compiler: [gnu]
        version: [12]
        include:
          - os: ubuntu-latest
            build: meson
            build-type: coverage
            compiler: gnu
            version: 12
          - os: macos-latest
            build: meson
            build-type: debug
            compiler: gnu
            version: 14
          - os: windows-latest
            build: meson
            build-type: debug
            compiler: msys
            version: 10
    defaults:
      run:
        shell: ${{ matrix.compiler == 'msys' && 'msys2 {0}' || 'bash' }}
    env:
      # the macOS images only ship versioned Homebrew compilers, the system
      # compiler is Apple clang which cannot provide OpenMP
      FC: ${{ contains(matrix.os, 'macos') && format('gfortran-{0}', matrix.version) || 'gfortran' }}
      CC: ${{ contains(matrix.os, 'macos') && format('gcc-{0}', matrix.version) || 'gcc' }}
      GCC_V: ${{ matrix.version }}
      PYTHON_V: 3.12
      OMP_NUM_THREADS: 1,2,1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_V }}
      - name: Install GCC (Linux)
        if: ${{ contains(matrix.os, 'ubuntu') && matrix.compiler == 'gnu' }}
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-${{ env.GCC_V}} gfortran-${{ env.GCC_V }}
          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-${{ env.GCC_V }} 100 \
            --slave /usr/bin/gfortran gfortran /usr/bin/gfortran-${{ env.GCC_V }} \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ env.GCC_V }}
      - name: Install GCC (Windows)
        if: ${{ contains(matrix.os, 'windows') && matrix.compiler == 'msys' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git mingw-w64-x86_64-python mingw-w64-x86_64-python-pip mingw-w64-x86_64-python-setuptools mingw-w64-x86_64-gcc mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-openblas mingw-w64-x86_64-lapack mingw-w64-x86_64-cmake mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
      - name: Install build and test dependencies
        if: ${{ ! contains(matrix.os, 'windows') }}
        run: pip3 install ${{ env.PIP_PACKAGES }}
      - name: Install build and test dependencies
        if: ${{ contains(matrix.os, 'windows') }}
        run: pip3 install meson
      - name: Configure build (meson)
        if: ${{ matrix.build == 'meson' }}
        run: >-
          meson setup ${{ env.BUILD_DIR }} --buildtype=debug --prefix=$PWD/_dist --libdir=lib --warnlevel=0 -Db_coverage=${{ env.COVERAGE }}
        env:
          COVERAGE: ${{ matrix.build-type == 'coverage' }}
      - name: Build library
        run: ninja -C ${{ env.BUILD_DIR }}
      - name: Run unit tests
        if: ${{ matrix.build == 'meson' }}
        run: |
          meson test -C ${{ env.BUILD_DIR }} --suite mctc-gcp --print-errorlogs --no-rebuild
        env:
          OMP_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
      - name: Create coverage report
        if: ${{ matrix.build == 'meson' && matrix.build-type == 'coverage' }}
        run: ninja -C ${{ env.BUILD_DIR }} coverage
      - name: Install project
        run: |
          ninja -C ${{ env.BUILD_DIR }} install
          echo "GCP_PREFIX=$PWD/_dist" >> $GITHUB_ENV
      - name: Create package
        if: ${{ matrix.build == 'meson' }}
        run: |
          tar czvf ${{ env.OUTPUT }} _dist
          echo "GCP_OUTPUT=${{ env.OUTPUT }}" >> $GITHUB_ENV
        env:
          OUTPUT: gcp-${{ matrix.compiler }}-${{ matrix.version }}-${{ matrix.os }}.tar.gz
      - name: Upload package
        if: ${{ matrix.build == 'meson' && matrix.build-type != 'coverage' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GCP_OUTPUT }}
          path: ${{ env.GCP_OUTPUT }}
      - name: Upload coverage report
        if: ${{ matrix.build == 'meson' && matrix.build-type == 'coverage' }}
        uses: codecov/codecov-action@v5
